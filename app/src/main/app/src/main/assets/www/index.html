<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi TV</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0E1116; overflow: hidden; }
body { font-family: Roboto, "Segoe UI", system-ui, sans-serif; color: #F2F4F7; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; padding: 56px 96px 0; display: flex; flex-direction: column; gap: 32px; overflow: hidden; }
.top { display: flex; align-items: center; justify-content: space-between; height: 72px; flex: 0 0 72px; }
.brand { display: flex; align-items: center; gap: 14px; font-size: 32px; font-weight: 700; letter-spacing: 0.02em; }
.dot { width: 20px; height: 20px; border-radius: 6px; background: var(--accent, #4CC2B0); }
.clock { font-size: 32px; font-weight: 500; color: #A7B0BD; }
.hero { display: flex; gap: 64px; height: 332px; flex: 0 0 332px; }
.hero-text { flex: 0 0 640px; display: flex; flex-direction: column; justify-content: center; gap: 18px; }
.label { font-size: 24px; font-weight: 600; letter-spacing: 0.14em; color: var(--accent, #4CC2B0); }
.hero-name { font-size: 64px; line-height: 1.05; font-weight: 700; }
.hero-desc { font-size: 28px; line-height: 1.4; color: #A7B0BD; min-height: 40px; }
.hint { display: flex; align-items: center; gap: 14px; font-size: 26px; color: #A7B0BD; }
.ok { display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 14px; border-radius: 10px; background: #F2F4F7; color: #0E1116; font-weight: 700; font-size: 22px; }
.hero-art { flex: 1 1 0; min-width: 0; border-radius: 24px; display: flex; align-items: center; justify-content: center; font-size: 96px; font-weight: 700; text-align: center; padding: 0 32px; transition: background 0.2s; }
.rows { display: flex; flex-direction: column; gap: 8px; }
.row-title { font-size: 32px; font-weight: 600; line-height: 1.25; }
.track-wrap { margin: 0 -96px; padding: 16px 96px; overflow: hidden; }
.track { display: flex; gap: 24px; transition: transform 0.25s; }
.tile { flex: 0 0 284px; height: 160px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 600; text-align: center; padding: 0 16px; transition: transform 0.15s, box-shadow 0.15s; }
.tile.focus { transform: scale(1.08); box-shadow: 0 0 0 4px #0E1116, 0 0 0 8px #F2F4F7; }
.toast { position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); padding: 18px 36px; border-radius: 14px; background: #F2F4F7; color: #0E1116; font-size: 28px; font-weight: 600; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="stage">
  <header class="top">
    <div class="brand"><div class="dot"></div><span id="brand">MI TV</span></div>
    <div class="clock" id="clock">--:--</div>
  </header>
  <section class="hero">
    <div class="hero-text">
      <div class="label">APP SELECCIONADA</div>
      <div class="hero-name" id="hero-name"></div>
      <div class="hero-desc" id="hero-desc"></div>
      <div class="hint"><span class="ok">OK</span><span>Presiona OK para abrir</span></div>
    </div>
    <div class="hero-art" id="hero-art"></div>
  </section>
  <div class="rows" id="rows"></div>
  <div class="toast" id="toast"></div>
</div>
<script>
window.CONFIG = {
  brand: "MI TV",
  accent: "#4CC2B0",
  rows: [
    { title: "Mis apps", apps: [
      { name: "Netflix", color: "#22303F", desc: "Películas y series.", packages: ["com.netflix.ninja"] },
      { name: "YouTube", color: "#2B2A3F", desc: "Videos y música.", packages: ["com.amazon.firetv.youtube", "com.google.android.youtube.tv"] },
      { name: "Prime Video", color: "#1F3A36", desc: "Películas y series de Amazon.", packages: ["com.amazon.firebat", "com.amazon.avod"] },
      { name: "Disney+", color: "#3A2A2E", desc: "Películas y series de Disney.", packages: ["com.disney.disneyplus"] },
      { name: "Max", color: "#333A24", desc: "Series y películas de HBO.", packages: ["com.wbd.stream", "com.hbo.hbonow"] },
      { name: "Plex", color: "#2A3342", desc: "Tu biblioteca personal.", packages: ["com.plexapp.android"] }
    ]},
    { title: "Más apps", apps: [
      { name: "Apple TV", color: "#2A3342", desc: "Series y películas de Apple.", packages: ["com.apple.atve.amazon.appletv"] },
      { name: "Paramount+", color: "#22303F", desc: "Series y películas.", packages: ["com.cbs.ott"] },
      { name: "Pluto TV", color: "#333A24", desc: "TV en vivo gratis.", packages: ["tv.pluto.android"] },
      { name: "Crunchyroll", color: "#3A2A2E", desc: "Anime.", packages: ["com.crunchyroll.crunchyroid"] },
      { name: "Spotify", color: "#1F3A36", desc: "Música y podcasts.", packages: ["com.spotify.tv.android"] },
      { name: "Twitch", color: "#2B2A3F", desc: "Transmisiones en vivo.", packages: ["tv.twitch.android.app"] }
    ]}
  ]
};
</script>
<script>
(function () {
  var C = window.CONFIG;
  var stage = document.getElementById('stage');
  document.documentElement.style.setProperty('--accent', C.accent);
  document.getElementById('brand').textContent = C.brand;
  document.title = C.brand;

  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + s + ')';
    stage.style.left = ((window.innerWidth - 1920 * s) / 2) + 'px';
    stage.style.top = ((window.innerHeight - 1080 * s) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();

  var clockEl = document.getElementById('clock');
  function tick() {
    var d = new Date();
    var h = d.getHours(), m = d.getMinutes();
    clockEl.textContent = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  }
  tick();
  setInterval(tick, 15000);

  var rowsEl = document.getElementById('rows');
  var tiles = [], tracks = [];
  C.rows.forEach(function (row, r) {
    var sec = document.createElement('section');
    var title = document.createElement('div');
    title.className = 'row-title';
    title.textContent = row.title;
    var wrap = document.createElement('div');
    wrap.className = 'track-wrap';
    var track = document.createElement('div');
    track.className = 'track';
    tiles[r] = [];
    row.apps.forEach(function (a, c) {
      var t = document.createElement('div');
      t.className = 'tile';
      t.style.background = a.color;
      t.textContent = a.name;
      track.appendChild(t);
      tiles[r][c] = t;
    });
    wrap.appendChild(track);
    sec.appendChild(title);
    sec.appendChild(wrap);
    rowsEl.appendChild(sec);
    tracks[r] = track;
  });

  var pos = { r: 0, c: 0 };
  var heroName = document.getElementById('hero-name');
  var heroDesc = document.getElementById('hero-desc');
  var heroArt = document.getElementById('hero-art');

  function current() { return C.rows[pos.r].apps[pos.c]; }

  function show() {
    for (var r = 0; r < tiles.length; r++) {
      for (var c = 0; c < tiles[r].length; c++) {
        tiles[r][c].classList.toggle('focus', r === pos.r && c === pos.c);
      }
      var off = (r === pos.r && pos.c > 4) ? (pos.c - 4) * 308 : 0;
      tracks[r].style.transform = 'translateX(' + (-off) + 'px)';
    }
    var a = current();
    heroName.textContent = a.name;
    heroDesc.textContent = a.desc || '';
    heroArt.textContent = a.name;
    heroArt.style.background = a.color;
  }

  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2600);
  }

  function launch() {
    var a = current();
    if (window.Android && window.Android.launch) {
      var ok = window.Android.launch(a.packages.join(','));
      if (!ok) toast(a.name + ' no está instalada en este Fire TV');
    } else {
      toast('Vista previa: abriría ' + a.name);
    }
  }

  document.addEventListener('keydown', function (e) {
    var k = e.keyCode;
    var rowLen = C.rows[pos.r].apps.length;
    if (k === 37) { pos.c = Math.max(0, pos.c - 1); }
    else if (k === 39) { pos.c = Math.min(rowLen - 1, pos.c + 1); }
    else if (k === 38) { pos.r = Math.max(0, pos.r - 1); pos.c = Math.min(pos.c, C.rows[pos.r].apps.length - 1); }
    else if (k === 40) { pos.r = Math.min(C.rows.length - 1, pos.r + 1); pos.c = Math.min(pos.c, C.rows[pos.r].apps.length - 1); }
    else if (k === 13 || k === 23 || k === 66 || k === 32) { launch(); }
    else { return; }
    e.preventDefault();
    show();
  });

  show();
})();
</script>
</body>
  </html>
